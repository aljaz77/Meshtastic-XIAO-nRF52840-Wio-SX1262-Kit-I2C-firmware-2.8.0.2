name: Build & self-test firmware

# Watches meshtastic/firmware for new releases. When one appears, this builds
# the Seeed XIAO nRF52840 + Wio-SX1262 "I2C" variant with this repo's overlay
# (BQ25798 solar charger driver), runs the self-tests and publishes the result
# as a GitHub Release in this repository.

on:
  schedule:
    - cron: "23 */6 * * *" # every 6 hours; does nothing if there is no new upstream release
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream tag/branch/commit to build (empty = newest release)"
        required: false
        default: ""
      include_prereleases:
        description: "Also pick upstream alpha/pre-releases when choosing the newest release"
        type: boolean
        default: true
      force:
        description: "Rebuild and replace assets even if this release already exists here"
        type: boolean
        default: false
  # Any branch: build + test changes before they are merged. Only the default branch publishes.
  push:
    paths:
      - ".github/workflows/build.yml"
      - "scripts/**"
      - "overlay/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - "scripts/**"
      - "overlay/**"
      - "tests/**"

env:
  UPSTREAM_REPO: meshtastic/firmware
  PIO_ENV: seeed_xiao_nrf52840_kit_i2c

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash # = bash -eo pipefail, so a failing test piped through tee still fails the job

jobs:
  # ---------------------------------------------------------------------------
  # 1. Find out what to build and whether we already published it
  # ---------------------------------------------------------------------------
  check:
    name: Check for new upstream version
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
      is_release: ${{ steps.pick.outputs.is_release }}
      prerelease: ${{ steps.pick.outputs.prerelease }}
      upstream_url: ${{ steps.pick.outputs.upstream_url }}
      build: ${{ steps.decide.outputs.build }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - name: Pick upstream version
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ github.event.inputs.upstream_ref }}
          INCLUDE_PRE: ${{ github.event.inputs.include_prereleases || vars.INCLUDE_PRERELEASES || 'true' }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_REF" ]; then
            REF="$REQUESTED_REF"
            if INFO=$(gh api "repos/$UPSTREAM_REPO/releases/tags/$REF" --jq '[.prerelease, .html_url] | @tsv' 2>/dev/null); then
              IS_RELEASE=true
              PRE=$(cut -f1 <<<"$INFO"); URL=$(cut -f2 <<<"$INFO")
            else
              IS_RELEASE=false; PRE=true; URL="https://github.com/$UPSTREAM_REPO/tree/$REF"
            fi
          else
            if [ "$INCLUDE_PRE" = "true" ]; then
              FILTER='[.[] | select(.draft | not)][0]'
            else
              FILTER='[.[] | select((.draft | not) and (.prerelease | not))][0]'
            fi
            INFO=$(gh api "repos/$UPSTREAM_REPO/releases?per_page=30" --jq "$FILTER | [.tag_name, .prerelease, .html_url] | @tsv")
            REF=$(cut -f1 <<<"$INFO"); PRE=$(cut -f2 <<<"$INFO"); URL=$(cut -f3 <<<"$INFO")
            IS_RELEASE=true
          fi
          [ -n "$REF" ] || { echo "::error::Could not determine an upstream release"; exit 1; }
          echo "Upstream ref: $REF (release=$IS_RELEASE, prerelease=$PRE)"
          {
            echo "ref=$REF"
            echo "is_release=$IS_RELEASE"
            echo "prerelease=$PRE"
            echo "upstream_url=$URL"
          } >> "$GITHUB_OUTPUT"

      - name: Decide whether to build / publish
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.pick.outputs.ref }}
          IS_RELEASE: ${{ steps.pick.outputs.is_release }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          EVENT: ${{ github.event_name }}
          ON_DEFAULT_BRANCH: ${{ github.ref_name == github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if gh release view "$REF" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            EXISTS=true
          else
            EXISTS=false
          fi

          PUBLISH=false
          if [ "$IS_RELEASE" = "true" ] && [ "$EVENT" != "pull_request" ] && [ "$ON_DEFAULT_BRANCH" = "true" ]; then
            if [ "$EXISTS" = "false" ] || [ "$FORCE" = "true" ]; then PUBLISH=true; fi
          fi

          # Scheduled runs only build when there is something new to publish.
          # Manual runs, pushes and PRs always build so the pipeline itself is tested.
          BUILD=$PUBLISH
          if [ "$EVENT" != "schedule" ]; then BUILD=true; fi

          echo "Already published here: $EXISTS -> build=$BUILD publish=$PUBLISH"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          {
            echo "### Upstream: \`$REF\`"
            echo "- already released here: **$EXISTS**"
            echo "- build: **$BUILD**, publish: **$PUBLISH**"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 2. Build the firmware and run the offline self-tests
  # ---------------------------------------------------------------------------
  build:
    name: Build & self-test
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.version.outputs.artifact }}
    steps:
      - name: Checkout this repo (self-test scripts)
        uses: actions/checkout@v7
        with:
          path: self

      - name: Checkout Meshtastic firmware @ ${{ needs.check.outputs.ref }}
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.check.outputs.ref }}
          path: firmware
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install PlatformIO (versions pinned by upstream)
        working-directory: firmware
        run: |
          python -m pip install --upgrade pip
          REQ=.github/actions/setup-base/requirements.txt
          if [ -f "$REQ" ]; then pip install -r "$REQ"; else pip install platformio adafruit-nrfutil; fi
          pio --version

      - name: Cache PlatformIO toolchains
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-nrf52-${{ hashFiles('firmware/**/*.ini') }}
          restore-keys: pio-nrf52-

      - name: "Self-test 1/4: BQ25798 driver unit tests (simulated chip)"
        working-directory: self
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I tests/stubs -I overlay/src tests/test_bq25798.cpp -o "$RUNNER_TEMP/test_bq25798"
          "$RUNNER_TEMP/test_bq25798" | tee "$RUNNER_TEMP/unit-test.txt"
          # Same tests with the board's real variant.h force-included: catches board macros
          # that clash with driver names in seconds instead of after the full firmware build.
          V=../firmware/variants/nrf52840/seeed_xiao_nrf52840_kit
          g++ -std=c++17 -Wall -Wextra -Werror -I tests/stubs -I overlay/src -I "$V" \
            -DSEEED_XIAO_NRF52840_KIT -DSEEED_XIAO_NRF_KIT_I2C -DCONFIG_NFCT_PINS_AS_GPIOS=1 -include variant.h \
            tests/test_bq25798.cpp -o "$RUNNER_TEMP/test_bq25798_variant"
          "$RUNNER_TEMP/test_bq25798_variant" | tail -1

      - name: Apply overlay (BQ25798 driver) to upstream source
        run: python self/scripts/apply_overlay.py firmware

      - name: "Self-test 2/4: pinout still matches the documented wiring"
        working-directory: firmware
        run: python ../self/scripts/check_pinout.py --env "$PIO_ENV"

      - name: Build ${{ env.PIO_ENV }}
        working-directory: firmware
        env:
          # Optional repository variable, e.g. "-DBQ25798_CHARGE_VOLTAGE_MV=3600" (see README)
          PLATFORMIO_BUILD_FLAGS: ${{ vars.EXTRA_BUILD_FLAGS }}
        run: bash bin/build-nrf52.sh "$PIO_ENV"

      - name: Determine version
        id: version
        working-directory: firmware
        env:
          REF: ${{ needs.check.outputs.ref }}
          IS_RELEASE: ${{ needs.check.outputs.is_release }}
        run: |
          VERSION=$(python bin/buildinfo.py long)
          echo "Built version: $VERSION"
          if [ "$IS_RELEASE" = "true" ] && [ "v$VERSION" != "$REF" ]; then
            echo "::error::Version mismatch: tag $REF but firmware reports $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact=firmware-$PIO_ENV-$VERSION" >> "$GITHUB_OUTPUT"

      - name: "Self-test 3/4: UF2 image (format, flash layout, version, drivers)"
        working-directory: firmware
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          LD=$(pio project config --json-output | python -c "
          import json, sys
          for s, o in json.load(sys.stdin):
              if s == 'env:$PIO_ENV':
                  print(dict(o).get('board_build.ldscript', ''))")
          ARGS=()
          if [ -n "$LD" ] && [ -f "$LD" ]; then ARGS=(--ld "$LD"); fi
          python ../self/scripts/verify_uf2.py "release/firmware-$PIO_ENV-$VERSION.uf2" --version "$VERSION" \
            --require-string "BQ25798 solar charger found" "${ARGS[@]}" | tee uf2-test.txt

      - name: "Self-test 4/4: OTA package integrity"
        working-directory: firmware/release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ZIP="firmware-$PIO_ENV-$VERSION-ota.zip"
          unzip -t "$ZIP"
          unzip -l "$ZIP" | grep -q manifest.json || { echo "::error::$ZIP has no manifest.json"; exit 1; }
          echo "OTA package OK"

      - name: Collect release files
        working-directory: firmware/release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p ../../out
          cp "firmware-$PIO_ENV-$VERSION.uf2" \
             "firmware-$PIO_ENV-$VERSION-ota.zip" \
             "firmware-$PIO_ENV-$VERSION.elf" ../../out/
          cp "firmware-$PIO_ENV-$VERSION.mt.json" ../../out/ 2>/dev/null || true
          cp Meshtastic_nRF52_factory_erase_v3_S140_7.3.0.uf2 ../../out/ 2>/dev/null || true
          { cat "$RUNNER_TEMP/unit-test.txt"; echo; cat ../uf2-test.txt; } > ../../out/self-test.txt
          cd ../../out && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Job summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## ✅ $PIO_ENV $VERSION"
            echo '```'
            cat out/self-test.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: out/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. OPTIONAL: flash a real board and talk to it (self-hosted runner)
  #    Enable by setting repository variable HIL_ENABLED=true and registering a
  #    self-hosted runner with the label "xiao-i2c" that has the board on USB.
  # ---------------------------------------------------------------------------
  hardware-test:
    name: Hardware-in-the-loop test
    needs: [check, build]
    if: vars.HIL_ENABLED == 'true'
    runs-on: [self-hosted, xiao-i2c]
    timeout-minutes: 15
    env:
      PORT: ${{ vars.HIL_PORT || '/dev/ttyACM0' }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: fw

      - name: Install tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet adafruit-nrfutil meshtastic

      - name: Flash over USB (serial DFU)
        run: |
          .venv/bin/adafruit-nrfutil --verbose dfu serial \
            --package fw/firmware-*-ota.zip -p "$PORT" -b 115200 --singlebank --touch 1200

      - name: Wait for the node to boot
        run: |
          for _ in $(seq 1 60); do [ -e "$PORT" ] && break; sleep 1; done
          sleep 15

      - name: Query the node and check version / hardware model
        run: |
          for _ in 1 2 3; do
            if .venv/bin/meshtastic --port "$PORT" --info > info.txt 2>&1; then break; fi
            sleep 10
          done
          cat info.txt
          grep -F "$VERSION" info.txt || { echo "::error::Board does not report firmware $VERSION"; exit 1; }
          grep -F "XIAO_NRF52_KIT" info.txt || { echo "::error::Board does not report hwModel XIAO_NRF52_KIT"; exit 1; }
          echo "Hardware test passed"

  # ---------------------------------------------------------------------------
  # 4. Publish a GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: [check, build, hardware-test]
    if: >-
      always() &&
      needs.check.outputs.publish == 'true' &&
      needs.build.result == 'success' &&
      (needs.hardware-test.result == 'success' || needs.hardware-test.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.check.outputs.ref }}
      VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
      UPSTREAM_URL: ${{ needs.check.outputs.upstream_url }}
      HIL: ${{ needs.hardware-test.result }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: out

      - name: Write release notes
        run: |
          if [ "$HIL" = "success" ]; then HIL_LINE="✅ Flashed to a real XIAO nRF52840 kit and verified over USB"; else HIL_LINE="➖ Hardware-in-the-loop test not configured"; fi
          cat > notes.md <<EOF
          Meshtastic **$VERSION** built for the **Seeed XIAO nRF52840 + Wio-SX1262 kit**, I2C variant
          (PlatformIO env \`$PIO_ENV\`), built from upstream [$TAG]($UPSTREAM_URL) plus this repo's
          small overlay: a driver for a **BQ25798 solar/MPPT charger** on the I2C bus (detected
          automatically; without it the node behaves like stock firmware). Solar panel, battery and
          system voltage/current are sent as power telemetry (ch1/ch2/ch3) when power metrics are enabled.

          ### Wiring in this variant
          | Function | XIAO pin | nRF52840 |
          |---|---|---|
          | I2C SDA | **D6** | P1.11 |
          | I2C SCL | **D7** | P1.12 |
          | GPS TX (MCU → GPS) | NFC1 pad | P0.09 |
          | GPS RX (GPS → MCU) | NFC2 pad | P0.10 |
          | User button | D0 | P0.02 |

          ### Which file do I need?
          - \`firmware-$PIO_ENV-$VERSION.uf2\`: drag-and-drop install (double-tap reset → copy to the USB drive that appears)
          - \`firmware-$PIO_ENV-$VERSION-ota.zip\`: Bluetooth OTA with the Nordic "nRF Device Firmware Update" app
          - \`Meshtastic_nRF52_factory_erase_v3_S140_7.3.0.uf2\`: wipes all settings (flash this first, then the firmware)
          - \`.elf\`: debug symbols, only needed to decode crash logs

          ### Self-tests
          - ✅ BQ25798 driver unit tests against a simulated charger
          - ✅ Pinout matches the documented wiring
          - ✅ UF2 format, nRF52840 family ID, flash layout, version string, radio, I2C & BQ25798 drivers
          - ✅ OTA package integrity
          - $HIL_LINE

          <details><summary>Self-test log</summary>

          \`\`\`
          $(cat out/self-test.txt)
          \`\`\`
          </details>

          Firmware source: https://github.com/$UPSTREAM_REPO/tree/$TAG + [overlay](https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA/overlay) (GPL-3.0)
          EOF
          cat notes.md

      - name: Create or update release
        run: |
          TITLE="Meshtastic $VERSION: XIAO nRF52840 + Wio-SX1262 (I2C + BQ25798 solar)"
          FLAGS=()
          [ "$PRERELEASE" = "true" ] && FLAGS+=(--prerelease)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --title "$TITLE" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md "${FLAGS[@]}"
          fi

  # ---------------------------------------------------------------------------
  # 5. If a scheduled build breaks, open (or update) an issue so it's noticed
  # ---------------------------------------------------------------------------
  report-failure:
    name: Report failure
    needs: [check, build, hardware-test, release]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REF: ${{ needs.check.outputs.ref }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - run: |
          TITLE="Automatic build failed for upstream $REF"
          BODY="The scheduled build/self-test for upstream \`$REF\` failed: $RUN_URL"
          NUM=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
